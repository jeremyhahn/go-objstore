name: Stage module-fetch credentials
description: >
  Write the tokenised git insteadOf key the runner injects (GIT_CONFIG_KEY_0)
  to a BuildKit secret file under RUNNER_TEMP, outside every build context, and
  hand its path to compose (GOMODAUTH_ENV) and to build-push-action (output
  `path`). The caller removes the file with `rm -f "${RUNNER_TEMP}/gomodauth.secret"`
  in an `if: always()` step.

outputs:
  path:
    description: Path of the staged secret file (empty when no credentials exist).
    value: ${{ steps.stage.outputs.path }}

runs:
  using: composite
  steps:
    # go mod download runs inside docker builds (the compose-built integration
    # and SDK images, the root Dockerfile) which cannot reach the internal Gitea
    # on their own. The runner injects GOPRIVATE and the tokenised insteadOf
    # rewrite into the job's process environment
    # (conventions/dependency-resolution.md §6), but a job environment does not
    # cross into a docker build. The file lives OUTSIDE every build context, so a
    # `COPY . .` cannot bake it into a layer (.dockerignore lists gomodauth* as a
    # second guard). Read the variable straight from the shell environment,
    # NEVER through ${{ env.X }}: that expression reads the workflow's own env:
    # block, which does not define it, and would quietly write blanks. On GitHub
    # the variable does not exist, the file is written empty, and each
    # Dockerfile's secret mount is optional, so the same builds resolve from the
    # public proxy.
    - name: Stage module-fetch credentials
      id: stage
      shell: bash
      run: |
        set -eu
        umask 077
        : > "${RUNNER_TEMP}/gomodauth.secret"
        if [ -n "${GIT_CONFIG_KEY_0:-}" ]; then
          # Write ONLY the tokenised insteadOf key, as raw data with no trailing
          # newline — never as `export NAME=value` shell. Each Dockerfile reads
          # it with a quoted command substitution, so a credential containing
          # shell metacharacters is assigned literally, never parsed or executed.
          printf '%s' "${GIT_CONFIG_KEY_0}" > "${RUNNER_TEMP}/gomodauth.secret"
          echo "staged Gitea module credential"
        else
          echo "no Gitea credentials in this environment; resolving from the public proxy"
        fi
        echo "GOMODAUTH_ENV=${RUNNER_TEMP}/gomodauth.secret" >> "$GITHUB_ENV"
        echo "path=${RUNNER_TEMP}/gomodauth.secret" >> "$GITHUB_OUTPUT"
