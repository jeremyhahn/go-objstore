# ci-template: v1.15 (customized)
# Reconciled against software/templates/github-actions/ci.yml in the
# automatethethings repo (devops.md §1/§8/§9). Divergence outside the
# repo-specific blocks below is a defect.
#
# v1.15 (2026-10-05, automatethethings#209/#211): push runs on main only.
# automerge.yml v7 opens each merge train as a PR into main, so a train gets
# its CI from the pull_request trigger like any PR.
#
# v1.14 (2026-10-04, automatethethings#207): EVERY JOB STARTS AT ONCE. No job
# `needs` another except ci-gate, so a run takes as long as its slowest job.
# This replaces v1.9's staged pipeline (lint/build first, the expensive tier
# behind them, docker behind integration-test). CI Gate, the one required
# check, still needs every job and fails closed on any result but success.
# docker builds its own image from the Dockerfile and consumes nothing from
# build or integration-test, so it starts at once too.
#
# `fips` and `trivy` STAY ON THE PUSH PATH, with every other job, and stay in
# ci-gate. A first pass at v1.9 moved them to nightly.yml to buy queue
# position; that was reverted the same night (agent-company ruling
# 2026-08-21, decided identically for go-signal an hour earlier).
#
# The nightly carve-out is for jobs that are KNOWN-RED and cannot clear from
# inside the repo — a job burning 90 runner-minutes to re-report a finding
# already written on an issue. Neither of these is that. Both PASS here (run
# 3865 on 67aa52a, and re-verified locally before this commit), and a passing
# gate carries signal: `fips` is the only thing standing between a
# non-approved primitive on a regulated path and a green build, and
# devops.md §8 makes `trivy` blocking outright. Weakening a gate that passes,
# to buy queue position, trades away the signal and keeps the cost.
#
# Cost is a real problem, but demoting gates is not the answer to it. If
# either job later goes red for a reason this repo cannot fix, moving it to
# nightly IS THE WHOLE ACT, not half of it: remove it from this file, from
# ci-gate's `needs`, AND from the gate loop — and say on an issue what would
# make it green again. A job that can pass and is not
# required is a fail-open gate.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets a run be repeated without inventing a commit, which matters when a
  # failure is the runner's rather than the code's.
  workflow_dispatch:

# Superseded-run cancellation (issue #41). A newer push to a ref cancels the
# older, now-pointless CI run on that same ref; the NEWEST run survives.
# Cancellation stops runs nobody will read.
#
# This corrects the earlier header claim that "Gitea cannot cancel in-flight
# jobs". `concurrency:` works on Gitea 1.27.1 (measured: go-netmon run 12242
# cancelled while 12269 completed; go-recountly run 12261 went queued ->
# cancelled on the newer push). The old evidence came from a job-level group
# keyed on the repository alone, with cancel-in-progress: false, so every
# task worker shared one saturated group; it said nothing about a ref-keyed
# group that cancels. What IS true is narrower: this Gitea has no `cancel`
# REST route (only rerun, rerun-failed-jobs, job rerun and DELETE), which is
# why `concurrency:` is the only mechanism available to a workflow.
# A human can still cancel a run through the session-authenticated web
# route (software/scripts/gitea-cancel-run.sh in the automatethethings repo).
#
# - cancel-in-progress is the literal `true`: Gitea 1.27.1 does not evaluate
#   expressions here, and any non-empty value is truthy.
# - The group leads with github.workflow, so it can never cancel the separate
#   Code Review workflow that also gates merges.
# - Adoption boundary, expected once: Gitea groups a run by the workflow file
#   of THAT run, so a run created before this block landed is in no group and
#   the first push after adoption cannot supersede it.
# - Workflow-level on purpose, and only in this file: nightly and release runs
#   must never be cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.1'
  COVERAGE_THRESHOLD: 89
  # The docker job builds with push: false / load: true and only ever scans the
  # result, so this is a local image name and nothing more. It used to be
  # ghcr.io/${{ github.repository }}, which named a registry that does not exist
  # off GitHub (infra/gitea/docs/lessons.md) for an image that is never pushed
  # anywhere. A bare tag scans identically on both servers and keeps the
  # internal registry address out of a file that mirrors to a public repo.
  # Release images are a different matter and are pushed by release.yml, whose
  # ghcr jobs are guarded to github.com.
  SCAN_IMAGE: 'objstore:ci-scan'

jobs:
  # Every job below starts at once (v1.14); only ci-gate has `needs`.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    # Latest action major, PINNED linter (devops.md §9 documented-pin clause;
    # unpin tracker go-qrdb#42). `version: latest` resolved to golangci-lint
    # v2.13.0, which panics under Go 1.26 -- "nilness: internal error:
    # unhandled builtin recover" out of honnef.co/go/tools v0.8.0-rc.1 -- and
    # takes the gate down with it. Unpin when an upstream release passes
    # across the portfolio (tracked on go-qrdb#42).
    #
    # Go 1.27 (issue #19): v2.12.2 cannot lint a `go 1.27.1` module. Its
    # prebuilt binary is built with go1.26 and refuses to load the config,
    # and built from source under 1.27 its bundled staticcheck
    # (honnef.co/go/tools v0.7.0) panics in buildir on the 1.27 stdlib.
    # v2.13.2 is the version baked into the portfolio runner image and
    # lints this tree clean under go1.27.1. `install-mode: goinstall`
    # builds it with the job's own Go, so a prebuilt binary's Go version
    # cannot fall behind the go directive again.
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2
        install-mode: goinstall
        args: --timeout=10m

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Build CLI
      run: make build-cli WITH_LOCAL=1 WITH_AWS=1 WITH_GCP=1 WITH_AZURE=1

    - name: Build server
      run: make build-server WITH_LOCAL=1 WITH_AWS=1 WITH_GCP=1 WITH_AZURE=1

    - name: Build shared library
      run: make lib WITH_LOCAL=1 WITH_AWS=1 WITH_GCP=1 WITH_AZURE=1

    # The C API suite is the ONLY coverage that reaches the //export wrappers:
    # `go test` refuses cgo in test files, so no Go test can call ObjstorePut
    # with C arguments, and a guard could be deleted from any wrapper with every
    # Go test still passing (go-objstore#25). It runs in THIS job because the
    # step above has just built the .so and its header — putting it in `test`
    # would mean building the shared library a second time for one second of
    # test, and this job is already in ci-gate.
    - name: Run C API test suite
      run: make -C examples/c_client run

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Verify version consistency
      run: make version-check

    - name: Run unit tests with coverage
      run: |
        mkdir -p coverage
        make test

    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage/unit.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Coverage: ${COVERAGE}%"
        if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
          echo "Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
          exit 1
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage/unit.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  sdk-tests:
    name: SDK Tests (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [go, typescript, python, ruby, rust, csharp]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Set up Node.js
      if: matrix.sdk == 'typescript'
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Python
      if: matrix.sdk == 'python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Ruby
      if: matrix.sdk == 'ruby'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Set up Rust
      if: matrix.sdk == 'rust'
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      if: matrix.sdk == 'rust'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: api/sdks/rust

    - name: Set up .NET
      if: matrix.sdk == 'csharp'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # The SDK test images build the server from the root Dockerfile, whose
    # go mod download resolves the internal go-enclave module (exports
    # GOMODAUTH_ENV, which the SDK compose files read).
    - name: Stage module-fetch credentials
      uses: ./.github/actions/stage-gomodauth

    - name: Run ${{ matrix.sdk }} SDK unit tests
      run: make -C api/sdks test-${{ matrix.sdk }}

    - name: Remove staged credentials
      if: always()
      run: rm -f "${RUNNER_TEMP}/gomodauth.secret"

  conformance-test:
    name: Cross-Protocol Conformance
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run conformance suite
      run: make conformance-test

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # The compose-built integration images run go mod download; stage the
    # module-fetch credentials for them (exports GOMODAUTH_ENV).
    - name: Stage module-fetch credentials
      uses: ./.github/actions/stage-gomodauth

    - name: Run local storage integration tests
      run: make integration-test-local

    - name: Run S3/MinIO integration tests
      run: make integration-test-s3

    - name: Run MinIO integration tests
      run: make integration-test-minio

    - name: Run Azure/Azurite integration tests
      run: make integration-test-azure

    - name: Run GCS integration tests
      run: make integration-test-gcs

    - name: Run factory integration tests
      run: make integration-test-factory

    - name: Run replication integration tests
      run: make integration-test-replication

    - name: Run CLI integration tests
      run: make integration-test-cli

    - name: Remove staged credentials
      if: always()
      run: rm -f "${RUNNER_TEMP}/gomodauth.secret"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    # gosec is installed and run on the runner's own toolchain rather than via
    # the securego/gosec action, which is what ci-template v1 prescribes. That
    # action is a docker action pinned to a golang:*-alpine image carrying
    # whatever Go the gosec release was built against -- 2.28.0 ships go1.26.5
    # with GOTOOLCHAIN=local. The moment go.mod moved to 1.26.6 every package
    # load failed with "go.mod requires go >= 1.26.6", and gosec exits 1 on
    # load errors exactly as it does on findings, so the gate went red with
    # zero security issues and no way to tell the difference.
    #
    # On Gitea the runner image bakes gosec and govulncheck at pinned versions
    # (/etc/ci-runner-tools.txt; pins live in agent-company's
    # infra/gitea/ci-runner/Dockerfile), so nothing is installed there
    # (go-objstore#38). A network `go install` was both a flake -- the
    # IPv6/sum.golang.org dial fails the step even with the tool present --
    # and a shadow: setup-go puts GOPATH/bin ahead of /usr/local/bin, so a
    # fresh @latest build silently replaced the pinned one. To bump a version,
    # ask agent-company to rebuild the image; do not add an install back.
    # github.com runners carry no such image, so the install stays there only.
    - name: Install gosec and govulncheck (github.com only; baked on Gitea)
      if: github.server_url == 'https://github.com'
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Report scanner versions
      run: |
        command -v gosec govulncheck
        gosec -version
        govulncheck -version

    # -tags mirrors the govulncheck step below. Without them the cloud backends
    # (pkg/s3, pkg/glacier, pkg/azure, pkg/azurearchive) are gated out of the
    # build and never scanned -- 129 files instead of 140.
    #
    # -stdout -verbose text puts findings in the job log. The JSON artifact is
    # GitHub-only (see below), so on Gitea the log is the only place a failure
    # is legible; writing solely to the file is what made this one opaque.
    #
    # No -severity/-confidence floor: this repo gates on low findings too.
    # -exclude-generated drops nothing hand-written in the pure-Go scan below.
    #
    # Two scans, split on cgo (go-objstore#59; devops.md §8: never
    # -exclude-generated on a cgo package).
    #
    # The pure-Go scan runs with CGO_ENABLED=0, the configuration release.yml
    # builds every shipped Go binary with, so loading it never runs the C
    # compiler. With cgo on, a cgo failure during the load (run 23663: same
    # tree green 90 minutes earlier on the same runner) made gosec exit 1 on
    # "could not import C" with zero findings, and it never printed the cgo
    # error itself. It excludes cmd/objstorelib, the one cgo package, which
    # the second scan covers.
    #
    # The cgo scan runs on cmd/objstorelib alone, with cgo on as `make lib`
    # builds it and WITHOUT -exclude-generated. go/packages hands gosec the
    # cgo-expanded file, headed "Code generated by cmd/cgo", so with that flag
    # the package was dropped and scanned as "Files: 0" on every green run,
    # hiding two G115 findings (#59). gosec's SSA analysers (G115 and the
    # like) see that file; its per-file AST rules and #nosec do not, a gosec
    # limitation. If the load fails, `go list` prints the errors gosec hides.
    - name: Run gosec security scanner
      env:
        CGO_ENABLED: "0"
      run: |
        gosec -exclude-generated \
          -tags local,awss3,gcpstorage,azureblob,glacier \
          -fmt json -out gosec-results.json -stdout -verbose text \
          -exclude-dir=examples -exclude-dir=cmd/objstorelib ./...

    - name: Run gosec on the cgo package (cmd/objstorelib)
      env:
        CGO_ENABLED: "1"
        TAGS: local,awss3,gcpstorage,azureblob,glacier
      run: |
        # The runner's default bash already runs -e -o pipefail; stated here
        # because the scan below is piped through tee and must keep gosec's
        # exit status if this step is ever given another shell.
        set -o pipefail
        # "Files: 0" is expected here: gosec counts only files its AST rules
        # visit, and the cgo-expanded file is not one. What this scan is for
        # is the SSA rules (G115 and the like), so first prove that these
        # flags can report one from a cgo file: a canary package with a
        # known G115 must fail. -exclude-generated, for one, would pass it.
        canary=cmd/zz-gosec-cgo-canary
        trap 'rm -rf "$canary"' EXIT
        mkdir -p "$canary"
        printf '%s\n' 'package main' '' '// #include <stdlib.h>' 'import "C"' '' \
          'import "os"' '' 'func main() { _ = C.int(len(os.Args)) }' > "$canary/main.go"
        if gosec -tags "$TAGS" -fmt text "./$canary/..." > "${RUNNER_TEMP}/gosec-canary.log" 2>&1 \
            || ! grep -q 'G115' "${RUNNER_TEMP}/gosec-canary.log"; then
          cat "${RUNNER_TEMP}/gosec-canary.log"
          echo "::error::gosec missed the planted G115 in a cgo file; this step cannot see cgo findings"
          exit 1
        fi
        rm -rf "$canary"

        log="${RUNNER_TEMP}/gosec-cgo.log"
        if ! gosec -tags "$TAGS" \
            -fmt json -out gosec-cgo-results.json -stdout -verbose text \
            ./cmd/objstorelib/... 2>&1 | tee "$log"; then
          echo "::group::package load errors, if any (cgo failures gosec does not print)"
          go list -e -deps -compiled -tags "$TAGS" \
            -f '{{if .Error}}{{.ImportPath}}: {{.Error}}{{end}}' ./cmd/objstorelib
          echo "::endgroup::"
          exit 1
        fi
        if ! grep -q 'Checking package: main$' "$log"; then
          echo "::error::gosec never analysed cmd/objstorelib; the cgo scan covered nothing"
          exit 1
        fi
        if grep -q 'Error building the SSA representation of the package main' "$log"; then
          echo "::error::gosec could not build SSA for cmd/objstorelib, so its SSA rules did not run"
          exit 1
        fi

    # upload-artifact v4+ refuses to run against any server that is not
    # github.com -- it detects one and reports "not currently supported on
    # GHES". Gitea presents as such, so this step is GitHub-only. The scan
    # itself has already run by this point; only the artifact is skipped.
    - name: Upload gosec results as artifact
      uses: actions/upload-artifact@v7
      if: always() && github.server_url == 'https://github.com'
      with:
        name: gosec-results
        path: |
          gosec-results.json
          gosec-cgo-results.json

    # EVERY module in the tree, not just the root one (go-objstore#17).
    # `govulncheck ./...` stops at the module boundary, and this repository has
    # three modules: the root, api/sdks/go, and examples/encryption. Only the
    # root was ever scanned.
    #
    # That was not a hypothetical gap. examples/encryption sat on x/net
    # v0.55.0, x/text v0.37.0 and grpc v1.81.1 -- three HIGH advisories -- while
    # this job reported green, because a tracked go.mod under a directory the
    # scanners skip is a place CVEs can live indefinitely. (Those particular
    # advisories were cleared by #15; this is what stops the next set.)
    #
    # The modules are DISCOVERED rather than listed, for the same reason the
    # gate lists its jobs explicitly: a hand-maintained inventory drifts, and
    # the drift is invisible until it strands something. A module added
    # tomorrow is scanned the day it lands.
    #
    # Every module is scanned even after one fails, so a single finding does
    # not hide the others; the job still fails if any did.
    - name: Run govulncheck (every module in the tree)
      run: |
        rc=0
        for mod in $(find . -name go.mod -not -path '*/vendor/*' | sort); do
          dir=$(dirname "$mod")
          echo "=== govulncheck $dir ==="
          ( cd "$dir" && GOFLAGS="-tags=local,awss3,gcpstorage,azureblob,glacier" govulncheck ./... ) || rc=1
        done
        exit $rc

  # A GATE, not a nightly job (agent-company ruling 2026-08-21). It passes, and
  # it is the only thing standing between a non-approved primitive on a
  # regulated path and a green build.
  #
  # GOFIPS140 selects the Go Cryptographic Module at BUILD time; GODEBUG selects
  # the enforcement level at RUN time, and both are needed. "only" rather than
  # "on" (ratified 2026-08-17): "on" loads the module but still PERMITS
  # non-approved algorithms, so a regulated path using MD5, SHA-1, or GCM with a
  # caller-chosen IV passes silently and this job reports green on exactly the
  # thing it exists to catch.
  #
  # If it goes red, the failure IS the finding: something on a tested path is
  # using non-approved cryptography. Fix the call site, or — when an external
  # format mandates the primitive — isolate it and record a cited exemption. Do
  # NOT weaken this to "on", add continue-on-error, tag-gate the failing package
  # out, or trim the package list.
  fips:
    name: FIPS
    runs-on: ubuntu-latest
    # This runs the whole unit suite a second time under the FIPS module, and
    # `make test` carries -race (go-objstore#18), so give it room. It is a gate,
    # not a background job — but a generous ceiling still beats a flaky one.
    timeout-minutes: 60
    env:
      GOFIPS140: latest
      GODEBUG: fips140=only

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Verify version consistency
      run: make version-check

    # GODEBUG is a runtime setting and cannot fail a compile, but building
    # against the module first keeps a genuine build break from being reported
    # as a test failure.
    - name: Build production packages (FIPS mode)
      run: go build -tags="local awss3 minio gcpstorage azureblob glacier azurearchive" ./...

    # Keep this invocation identical to the Test job so FIPS mode uses the same
    # build tags, package scope, and dark-suite/integration exclusions. A FIPS
    # job over a subset of the suite cannot tell you the product is FIPS-clean.
    - name: Run unit tests with coverage
      run: |
        mkdir -p coverage
        make test

    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage/unit.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Coverage: ${COVERAGE}%"
        if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
          echo "Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
          exit 1
        fi

  # trivy fs -- dependency CVEs AND leaked secrets in the tree. devops.md §8
  # makes this BLOCKING on both servers; it is in ci-gate for that reason.
  #
  # It runs on the runner itself rather than inside the docker job's container,
  # which cannot mount its own workspace into the host daemon.
  #
  # Scoping: test/ holds harnesses that ship in no release; coverage/ and bin/
  # are build output; **/vendor is gitignored language-SDK tooling absent from a
  # CI checkout. api/sdks/* IS scanned -- those SDKs ship, so their lockfiles
  # are in scope. There is no .trivyignore in this repo, so no --ignorefile.
  #
  # examples/ is deliberately NOT skipped (go-objstore#17). It used to be, and
  # that is precisely how examples/encryption -- a tracked Go module -- carried
  # three HIGH advisories while every gate reported green. "Does not ship" is a
  # reason to care less about a finding, not a reason to be unable to see it.
  # Do not re-add the skip to silence a finding.
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # Two paths for one gate. trivy-action's setup step cannot authenticate to
    # github.com from a Gitea runner and upload-sarif has no GHES-compatible
    # endpoint there, so the action path is guarded on the server URL and Gitea
    # gates with the trivy CLI below. Both run the same fs scan at the same
    # severity; only the SARIF upload is GitHub-only.
    - name: Trivy scan (SARIF for code scanning)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        format: sarif
        output: trivy-results.sarif
        exit-code: 0
        skip-dirs: test,coverage,bin,**/vendor

    - name: Upload Trivy SARIF
      if: always() && github.server_url == 'https://github.com'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif
        category: trivy-fs

    - name: Trivy gate (fail on CRITICAL/HIGH)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        severity: CRITICAL,HIGH
        exit-code: 1
        format: table
        skip-dirs: test,coverage,bin,**/vendor

    # Retried with backoff: raw.githubusercontent.com intermittently answers a
    # Gitea runner with transient HTTP errors (curl exit 22), which failed the
    # whole job on a fetch that succeeds seconds later. Now that this job gates
    # again, one network blip would block every merge, so the retry is not
    # optional. Do NOT "fix" a persistent failure by dropping the gate.
    - name: Install Trivy CLI (Gitea)
      if: github.server_url != 'https://github.com'
      run: |
        for i in 1 2 3 4 5; do
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin && exit 0
          echo "trivy install attempt $i failed; retrying in $((i*10))s"
          sleep $((i*10))
        done
        echo "trivy install failed after 5 attempts" >&2
        exit 1

    - name: Trivy gate (Gitea)
      if: github.server_url != 'https://github.com'
      run: |
        trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table \
          --skip-dirs test --skip-dirs coverage --skip-dirs bin \
          --skip-dirs '**/vendor' .

  docker:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # The root Dockerfile's `go mod download` resolves the internal first-party
    # module go-enclave from Gitea (conventions/dependency-resolution.md §6).
    # The path is read from the action's OUTPUT, not env — build-push-action's
    # secret-files is an expression context where ${{ env.X }} /
    # ${{ runner.temp }} can resolve empty.
    - name: Stage module-fetch credentials
      id: gomodauth
      uses: ./.github/actions/stage-gomodauth

    - name: Build Docker image for scanning
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: false
        load: true
        tags: ${{ env.SCAN_IMAGE }}
        secret-files: |
          gomodauth=${{ steps.gomodauth.outputs.path }}
        # type=gha talks to the Actions cache service, which only exists on
        # GitHub. Elsewhere buildkit cannot reach it and the build fails on a
        # cache lookup timeout rather than anything to do with the image.
        cache-from: ${{ github.server_url == 'https://github.com' && 'type=gha' || '' }}
        cache-to: ${{ github.server_url == 'https://github.com' && 'type=gha,mode=max' || '' }}

    - name: Remove staged credentials
      if: always()
      run: rm -f "${RUNNER_TEMP}/gomodauth.secret"

    # Trivy runs from its own image rather than aquasecurity/trivy-action.
    # That action fetches its install script with a nested checkout, which a
    # self-hosted runner resolves against its own server instead of GitHub and
    # fails with git exit 128. Invoking the scanner directly works the same on
    # both servers and keeps container scanning everywhere.
    #
    # Output goes to stdout and is redirected here, not written through a bind
    # mount: the runner's job container cannot mount its own workspace into the
    # host daemon.
    - name: Run Trivy vulnerability scanner
      run: |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
            --format sarif \
            --severity CRITICAL,HIGH \
            --no-progress \
            "${SCAN_IMAGE}" > trivy-results.sarif
      env:
        SCAN_IMAGE: ${{ env.SCAN_IMAGE }}

    # Informational only; the gate is the table-output step below, which is
    # what actually fails the job. This line just makes the count visible in
    # the log next to the SARIF that gets uploaded.
    - name: Report Trivy finding count
      run: |
        python3 -c 'import json; d=json.load(open("trivy-results.sarif")); print("trivy CRITICAL/HIGH findings:", sum(len(r.get("results",[])) for r in d.get("runs",[])))'

    # The code scanning API is GitHub-only; anywhere else this 404s. The scan
    # itself still runs and still fails the job on a finding.
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always() && github.server_url == 'https://github.com'
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-container'

    # THE GATE (devops.md §8): every image this repo builds is scanned, and a
    # CRITICAL/HIGH finding fails the job on both servers. The SARIF pass above
    # is for the Security tab and deliberately does not gate -- it is
    # GitHub-only plumbing. Reproduce locally with `make trivy-image`.
    - name: Trivy image gate (fail on CRITICAL/HIGH)
      run: |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --no-progress \
            "${SCAN_IMAGE}"
      env:
        SCAN_IMAGE: ${{ env.SCAN_IMAGE }}

    # The filesystem scan that used to sit here was secret-only, GitHub-only
    # and non-gating. It became its own `trivy` job (running on the runner
    # itself rather than inside this job's container, scanning vuln,secret on
    # both servers -- devops.md §8), and v1.9 moved that job to nightly.yml.
    # The image scan below is unaffected and still gates here.

    # anchore/scan-action installs its binary through a nested checkout, which a
    # self-hosted runner resolves against its own server and fails. Trivy above
    # already scans the same image on every server; Grype is the GitHub-only
    # second opinion.
    - name: Run Grype vulnerability scanner
      uses: anchore/scan-action@v6
      if: github.server_url == 'https://github.com'
      id: grype
      with:
        image: ${{ env.SCAN_IMAGE }}
        fail-build: false
        severity-cutoff: high
        output-format: sarif

    - name: Upload Grype results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      # SARIF upload to the Security tab is best-effort: a transient empty/truncated
      # SARIF from the scanner must not fail an otherwise-green build (the scan itself
      # already ran above). Guard on a non-empty output and never block on upload.
      if: always() && github.server_url == 'https://github.com' && steps.grype.outputs.sarif != ''
      continue-on-error: true
      with:
        sarif_file: ${{ steps.grype.outputs.sarif }}
        category: 'grype'

  # The single required check (devops.md §1). Every job in this workflow
  # appears in BOTH the needs list and the check loop -- a gate that can pass
  # vacuously is worse than no gate. join(needs.*.result) is deliberately not
  # used: it evaluates empty on Gitea and reports success while jobs fail.
  #
  # `fips` and `trivy` ARE here. They were briefly moved to nightly.yml and out
  # of this list; that was reverted the same night (agent-company ruling
  # 2026-08-21). Both pass, devops.md §8 makes trivy blocking, and a passing
  # gate that nothing requires is a fail-open gate.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, build, test, sdk-tests, conformance-test, integration-test, security, trivy, fips, docker]

    steps:
    - name: Fail closed on any non-success
      env:
        RESULT_LINT: ${{ needs.lint.result }}
        RESULT_BUILD: ${{ needs.build.result }}
        RESULT_TEST: ${{ needs.test.result }}
        RESULT_SDK_TESTS: ${{ needs.sdk-tests.result }}
        RESULT_CONFORMANCE_TEST: ${{ needs.conformance-test.result }}
        RESULT_INTEGRATION_TEST: ${{ needs.integration-test.result }}
        RESULT_SECURITY: ${{ needs.security.result }}
        RESULT_TRIVY: ${{ needs.trivy.result }}
        RESULT_FIPS: ${{ needs.fips.result }}
        RESULT_DOCKER: ${{ needs.docker.result }}
      run: |
        # `skipped` is not the same as `failed`, and BOTH fail the gate. No
        # job depends on another, so a skip means the job never ran (a
        # cancelled or filtered run); naming it keeps that loud. An
        # unreadable (empty) result fails closed rather than passing.
        status=0
        check() {
          case "$2" in
            success) echo "ok:   $1 = success" ;;
            skipped) echo "SKIP: $1 (job did not run - failing closed)";       status=1 ;;
            "")      echo "FAIL: $1 result is unreadable - failing closed";     status=1 ;;
            *)       echo "FAIL: $1 = $2";                                     status=1 ;;
          esac
        }
        check lint             "$RESULT_LINT"
        check build            "$RESULT_BUILD"
        check test             "$RESULT_TEST"
        check sdk-tests        "$RESULT_SDK_TESTS"
        check conformance-test "$RESULT_CONFORMANCE_TEST"
        check integration-test "$RESULT_INTEGRATION_TEST"
        check security         "$RESULT_SECURITY"
        check trivy            "$RESULT_TRIVY"
        check fips             "$RESULT_FIPS"
        check docker           "$RESULT_DOCKER"
        exit $status
