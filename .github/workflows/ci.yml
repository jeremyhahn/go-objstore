name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Lets a run be repeated without inventing a commit, which matters when a
  # failure is the runner's rather than the code's.
  workflow_dispatch:

env:
  GO_VERSION: '1.26.5'
  COVERAGE_THRESHOLD: 89
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Verify version consistency
      run: make version-check

    - name: Run unit tests with coverage
      run: |
        mkdir -p coverage
        make test

    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage/unit.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Coverage: ${COVERAGE}%"
        if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
          echo "Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
          exit 1
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage/unit.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  sdk-tests:
    name: SDK Tests (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [go, typescript, python, ruby, rust, csharp]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Set up Node.js
      if: matrix.sdk == 'typescript'
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Python
      if: matrix.sdk == 'python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Ruby
      if: matrix.sdk == 'ruby'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Set up Rust
      if: matrix.sdk == 'rust'
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      if: matrix.sdk == 'rust'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: api/sdks/rust

    - name: Set up .NET
      if: matrix.sdk == 'csharp'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Run ${{ matrix.sdk }} SDK unit tests
      run: make -C api/sdks test-${{ matrix.sdk }}

  conformance-test:
    name: Cross-Protocol Conformance
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run conformance suite
      run: make conformance-test

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run local storage integration tests
      run: make integration-test-local

    - name: Run S3/MinIO integration tests
      run: make integration-test-s3

    - name: Run MinIO integration tests
      run: make integration-test-minio

    - name: Run Azure/Azurite integration tests
      run: make integration-test-azure

    - name: Run GCS integration tests
      run: make integration-test-gcs

    - name: Run factory integration tests
      run: make integration-test-factory

    - name: Run replication integration tests
      run: make integration-test-replication

    - name: Run CLI integration tests
      run: make integration-test-cli

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.1
        args: --timeout=10m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run gosec security scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt json -out gosec-results.json -exclude-dir=examples ./...'

    # upload-artifact v4+ refuses to run against any server that is not
    # github.com -- it detects one and reports "not currently supported on
    # GHES". Gitea presents as such, so this step is GitHub-only. The scan
    # itself has already run by this point; only the artifact is skipped.
    - name: Upload gosec results as artifact
      uses: actions/upload-artifact@v7
      if: always() && github.server_url == 'https://github.com'
      with:
        name: gosec-results
        path: gosec-results.json

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        GOFLAGS="-tags=local,awss3,gcpstorage,azureblob,glacier" govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, security]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Build CLI
      run: make build-cli WITH_LOCAL=1 WITH_AWS=1 WITH_GCP=1 WITH_AZURE=1

    - name: Build server
      run: make build-server WITH_LOCAL=1 WITH_AWS=1 WITH_GCP=1 WITH_AZURE=1

    - name: Build shared library
      run: make lib WITH_LOCAL=1 WITH_AWS=1 WITH_GCP=1 WITH_AZURE=1

  docker:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs: [build, integration-test]
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image for scanning
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64
        push: false
        load: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-scan
        # type=gha talks to the Actions cache service, which only exists on
        # GitHub. Elsewhere buildkit cannot reach it and the build fails on a
        # cache lookup timeout rather than anything to do with the image.
        cache-from: ${{ github.server_url == 'https://github.com' && 'type=gha' || '' }}
        cache-to: ${{ github.server_url == 'https://github.com' && 'type=gha,mode=max' || '' }}

    # Trivy runs from its own image rather than aquasecurity/trivy-action.
    # That action fetches its install script with a nested checkout, which a
    # self-hosted runner resolves against its own server instead of GitHub and
    # fails with git exit 128. Invoking the scanner directly works the same on
    # both servers and keeps container scanning everywhere.
    #
    # Output goes to stdout and is redirected here, not written through a bind
    # mount: the runner's job container cannot mount its own workspace into the
    # host daemon.
    - name: Run Trivy vulnerability scanner
      run: |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
            --format sarif \
            --severity CRITICAL,HIGH \
            --no-progress \
            "${REGISTRY}/${IMAGE_NAME}:ci-scan" > trivy-results.sarif
      env:
        REGISTRY: ${{ env.REGISTRY }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}

    # Reported, not enforced -- matching the previous behaviour, where the
    # action ran without exit-code and findings were triaged in the Security
    # tab rather than breaking the build.
    - name: Report Trivy finding count
      run: |
        python3 -c 'import json; d=json.load(open("trivy-results.sarif")); print("trivy CRITICAL/HIGH findings:", sum(len(r.get("results",[])) for r in d.get("runs",[])))'

    # The code scanning API is GitHub-only; anywhere else this 404s. The scan
    # itself still runs and still fails the job on a finding.
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always() && github.server_url == 'https://github.com'
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-container'

    - name: Run Trivy vulnerability scanner (table output)
      run: |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image \
            --format table \
            --severity CRITICAL,HIGH \
            --no-progress \
            "${REGISTRY}/${IMAGE_NAME}:ci-scan"
      env:
        REGISTRY: ${{ env.REGISTRY }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}

    # GitHub-only, like Grype below. A filesystem scan needs the workspace
    # inside the scanner, and a containerised runner cannot mount its own
    # workspace into the host daemon. Its only consumer is the Security tab
    # upload, which is GitHub-only anyway, so there is nothing to reconstruct
    # it for. The image scan above still runs on every server.
    - name: Scan for secrets with Trivy
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        scanners: 'secret'
        format: 'sarif'
        output: 'trivy-secret-results.sarif'

    - name: Upload secret scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && github.server_url == 'https://github.com'
      with:
        sarif_file: 'trivy-secret-results.sarif'
        category: 'trivy-secrets'

    # anchore/scan-action installs its binary through a nested checkout, which a
    # self-hosted runner resolves against its own server and fails. Trivy above
    # already scans the same image on every server; Grype is the GitHub-only
    # second opinion.
    - name: Run Grype vulnerability scanner
      uses: anchore/scan-action@v6
      if: github.server_url == 'https://github.com'
      id: grype
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-scan
        fail-build: false
        severity-cutoff: high
        output-format: sarif

    - name: Upload Grype results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      # SARIF upload to the Security tab is best-effort: a transient empty/truncated
      # SARIF from the scanner must not fail an otherwise-green build (the scan itself
      # already ran above). Guard on a non-empty output and never block on upload.
      if: always() && github.server_url == 'https://github.com' && steps.grype.outputs.sarif != ''
      continue-on-error: true
      with:
        sarif_file: ${{ steps.grype.outputs.sarif }}
        category: 'grype'
