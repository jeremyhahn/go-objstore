# scans-template: v1.0.0 — the scheduled scans on main and their ONE fix PR.
# v1.0.0 (2026-11-16, owner ruling 742 (1); was deps-bump-template v1.1.0,
# file deps-bump.yml): ci-template v1.42 makes the CI Gate hermetic, so every
# check that fails on the state of the world rather than on a change runs
# here, and only here: `make deps-check` as the full gate (lags with
# DEPS_CHECK_LAG=fail, and -vuln: govulncheck's vulnerable requirements),
# `make security` (gosec, govulncheck, go mod verify, trivy fs) and `trivy
# image` of the integration image. It runs on a schedule and on
# workflow_dispatch on main, never on a pull_request or a push, and it is
# not the workflow named CI, so a finding never reads as a red main, never
# blocks a PR and never starts revert-red-main.yml. When the scans fire, the
# bump (`make deps-bump`, then `make build`) is the fix: the go.mod and
# go.sum changes land as ONE commit on ci/deps-bump with ONE PR, created or
# updated, whose body lists every finding. A finding the bump does not clear
# (a vulnerable version with no fixed release, an image package, an
# undocumented replace) opens or updates ONE issue, found by its fixed title
# (SCAN_ISSUE_TITLE), with the findings and the run link, and fails this
# job, so the Actions run is red; a run with no such finding closes that
# issue. With no finding and nothing to bump there is no PR and no issue.
# Previously deps-bump.yml only bumped, and its verify stopped the PR on any
# remaining finding. Follow-up: depscheck's reason-comment check on a
# touched fork replace or pseudo-version reads only the tree, but it runs
# inside deps-check and so only here until depscheck offers it alone.
# v1.1.0 (2026-11-16, owner ruling 732): ci-template v1.40's deps-check
# reports every lag behind a newer upstream release and never fails a PR or a
# main run on one, so this workflow is the only place a lag fails. Its verify
# runs the full gate by name, `make deps-check DEPS_CHECK_LAG=fail` (depscheck
# v1.1.0), and the ONE PR on ci/deps-bump carries the bump.
# v1.0.0 (2026-11-14, ruling 640, owner decision 222 (a); ruling 633 allows
# the schedule trigger, and no host timer runs it): ci-template v1.39's
# deps-check fails a library behind its latest release only when a change
# adds or bumps it, so a lag nobody touches no longer reddens a PR. This
# workflow carries those lags instead. Once a day, and on workflow_dispatch,
# it runs the shared depscheck's `make deps-bump` in the toolchain image,
# verifies with `make deps-check` (the full gate, no base) and `make build`,
# and lands the go.mod and go.sum changes as ONE commit on the fixed branch
# ci/deps-bump, with ONE pull request into main labelled `code-review` and
# `task:ready`, so the normal review and auto-merge land it.
#
#   - The commit is written through the git data API with GITHUB_TOKEN
#     (blobs, a tree on the base commit's tree, a commit), so GitHub signs it
#     and the Signatures check reads it as a `web-flow` commit.
#   - With an open PR on the branch, the job first calls
#     PUT pulls/N/update-branch and builds on the PR's new tip. It never
#     force-updates a ref: a ref update is a fast-forward, and a branch left
#     behind by an unmerged closed PR fails the job, for a person to close.
#     The branch of a merged PR is deleted and re-created from main, which
#     loses nothing.
#   - A govulncheck finding on the standard library, the toolchain or an
#     indirect-only module is reported, not failed, by deps-check, so it does
#     not stop the verify: the portfolio-wide toolchain pass carries stdlib.
#   - A PR or push made with GITHUB_TOKEN starts no pull_request run, so the
#     job dispatches ci.yml on ci/deps-bump; ci-template v1.39 accepts that
#     dispatch (v1.41: as the full tier) and its CI Gate check attaches to
#     the head. From v1.42 that CI run has no deps-check or advisory scan;
#     the Scans step below is what checked the bumped tree.
#   - OPEN OWNER QUESTION: code-review.yml runs on pull_request_target, which
#     a GITHUB_TOKEN PR or label change does not start either, so the review
#     does not begin on its own. code-review.yml is unchanged here; until the
#     owner rules, a person or agent with its own token re-applies the
#     `code-review` label to start it.
#
# GitHub only (the git data API calls are GitHub's). Copy to
# .github/workflows/scans.yml and delete .github/workflows/deps-bump.yml in
# the same PR. The Makefile needs `deps-bump`, `deps-check`, `security`,
# `build`, `docker-build`, `toolchain-image` and `it-image` (handbook
# templates/deps/depscheck/README.md, devcontainer.md §6). CUSTOMIZE: the
# cron minute, per repository, off 03:00 (nightly), 04:00 (ci) and fuzz.yml's,
# and GO_BUILD_TAGS, equal to ci.yml's.

name: Scheduled Scans

on:
  schedule:
    - cron: '17 6 * * *'   # CUSTOMIZE (go-objstore): the minute, per repository
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write   # v1.0.0: the one issue for a finding the bump cannot clear
  actions: write

# One bump at a time per repository; a newer run waits, never cancels one
# halfway through its ref update.
concurrency:
  group: scans-${{ github.repository }}
  cancel-in-progress: false

env:
  BRANCH: ci/deps-bump
  PR_TITLE: 'deps: scheduled scan fixes, bump dependencies to latest (ruling 742)'
  GO_BUILD_TAGS: ""   # CUSTOMIZE: ci.yml's GO_BUILD_TAGS
  # The one issue's title; the job finds the open issue by this exact title.
  SCAN_ISSUE_TITLE: 'scans: findings the scheduled bump cannot clear (ruling 742)'

jobs:
  scans:
    name: Scheduled scans and fix PR
    if: ${{ github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: pr
      CI_IMAGE_NAMESPACE: ${{ vars.CI_IMAGE_NAMESPACE }}
    steps:
      # The commit to build on: the open PR's tip after update-branch, or
      # main's tip when there is no open PR.
      - name: Find the base commit
        id: base
        run: |
          set -euo pipefail
          owner=${REPO%%/*}
          pr=$(gh api "repos/$REPO/pulls?state=open&head=$owner:$BRANCH&base=main" --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
            # 202 starts the merge of main into the branch; 422 means there
            # is nothing to merge. Either way read the tip it leaves.
            if gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" -f expected_head_sha="$head" >/dev/null 2>&1; then
              for _ in $(seq 1 24); do
                read -r -t 5 < /dev/zero || true
                now=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
                [ "$now" != "$head" ] && break
              done
            fi
            sha=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
            echo "open PR #$pr on $BRANCH; building on its tip $sha"
          else
            sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
            if gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
              merged=$(gh api "repos/$REPO/pulls?state=closed&head=$owner:$BRANCH&base=main&sort=updated&direction=desc" --jq '.[0].merged_at // empty')
              if [ -z "$merged" ]; then
                echo "::error::$BRANCH exists with no open PR and its last PR was not merged; close or delete it by hand (this job never force-updates a ref)"
                exit 1
              fi
              gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null
              echo "$BRANCH belonged to a merged PR: deleted, re-created from main"
            fi
            echo "no open PR on $BRANCH; building on main $sha"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.base.outputs.sha }}

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Pull the toolchain image from the registry cache
        run: scripts/ci-image-cache.sh pull || true

      # v1.0.0: the toolchain and integration images, as ci.yml's image job
      # builds them (APK_INDEX_SUM, IT_IMAGE), so trivy image scans what CI
      # would publish from this tree.
      - name: Build the devcontainer images
        run: |
          APK_INDEX_SUM=$(scripts/apk-index-sum.sh)
          export APK_INDEX_SUM
          echo "APK_INDEX_SUM=$APK_INDEX_SUM" >> "$GITHUB_ENV"
          it=$(make -s it-image)
          echo "IT_IMAGE=$it" >> "$GITHUB_ENV"
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          make docker-build MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$it"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # in-toolchain-image.sh runs on a copy of the checkout, so the bump and
      # the build run in one container, their output on stderr, and the
      # go.mod and go.sum diff comes back on stdout. v1.0.0: the scans run
      # after, on the bumped tree, so a finding the bump does not clear is
      # not stopped here; it is listed in the PR and fails the job at the end.
      - name: make deps-bump, then make build
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # expands in the container
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
            '{ make deps-bump && make build; } >&2 && git -c safe.directory="*" diff --binary -- ":(glob)**/go.mod" ":(glob)**/go.sum" | base64 -w0' \
            > "$RUNNER_TEMP/bump.b64"
          base64 -d "$RUNNER_TEMP/bump.b64" > "$RUNNER_TEMP/bump.patch"
          if [ ! -s "$RUNNER_TEMP/bump.patch" ]; then
            echo "deps-bump: nothing moved"
            echo "CHANGED=" >> "$GITHUB_ENV"
            exit 0
          fi
          git apply --index "$RUNNER_TEMP/bump.patch"
          git diff --cached --stat
          echo "CHANGED=$(git diff --cached --name-only | tr '\n' ' ')" >> "$GITHUB_ENV"

      # v1.0.0 (ruling 742 (1)): the checks that left ci.yml, on the bumped
      # tree (the checkout holds the bump after `git apply --index`). Each runs
      # to the end; FIRED lists the ones that still fail, and the step's own
      # log keeps their output. trivy image scans the integration image built
      # from main, with ci.yml v1.41's flags (devops.md §8).
      - name: Scans (deps-check full gate, make security, trivy image)
        id: scans
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          fired=
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make deps-check DEPS_CHECK_LAG=fail" || fired="$fired deps-check"
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make security GO_BUILD_TAGS='$GO_BUILD_TAGS'" || fired="$fired security"
          if docker save -o it-image.tar "$IT_IMAGE"; then
            scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
              trivy image --input it-image.tar --ignore-unfixed --skip-dirs /opt/go/mod --severity CRITICAL,HIGH --exit-code 1 || fired="$fired trivy-image"
          else
            fired="$fired trivy-image"
          fi
          rm -f it-image.tar
          fired=${fired# }
          echo "scans: ${fired:-none fired}"
          echo "fired=$fired" >> "$GITHUB_OUTPUT"

      # One commit through the git data API, so GitHub signs it, then a
      # fast-forward ref update (force: false) or a new ref.
      - name: Commit to ci/deps-bump
        if: ${{ env.CHANGED != '' }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          entries='[]'
          for f in $CHANGED; do
            if [ -f "$f" ]; then
              blob=$(base64 -w0 "$f" | jq -Rs '{content: ., encoding: "base64"}' | gh api "repos/$REPO/git/blobs" --input - --jq .sha)
              entries=$(jq -c --arg p "$f" --arg s "$blob" '. + [{path: $p, mode: "100644", type: "blob", sha: $s}]' <<<"$entries")
            else
              entries=$(jq -c --arg p "$f" '. + [{path: $p, mode: "100644", type: "blob", sha: null}]' <<<"$entries")
            fi
          done
          base_tree=$(gh api "repos/$REPO/git/commits/$BASE_SHA" --jq .tree.sha)
          tree=$(jq -n --arg b "$base_tree" --argjson e "$entries" '{base_tree: $b, tree: $e}' | gh api "repos/$REPO/git/trees" --input - --jq .sha)
          msg=$(printf 'deps: bump dependencies to latest (ruling 742)\n\n%s\n' "$(git diff --cached --stat)")
          commit=$(jq -n --arg m "$msg" --arg t "$tree" --arg p "$BASE_SHA" '{message: $m, tree: $t, parents: [$p]}' | gh api "repos/$REPO/git/commits" --input - --jq .sha)
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$commit" -F force=false >/dev/null
          else
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$commit" >/dev/null
          fi
          echo "deps-bump: $commit on $BRANCH"

      - name: Open the PR and label it
        id: pr
        if: ${{ env.CHANGED != '' || steps.base.outputs.pr != '' }}
        env:
          PR: ${{ steps.base.outputs.pr }}
          FIRED: ${{ steps.scans.outputs.fired }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # backquotes are markdown, not a command
          body=$(printf '%s\n\n%s\n\n%s\n' \
            'The scheduled scans on main (scans.yml, ruling 742 (1)): every go.mod requirement behind its latest release, with no reason comment and past the 7-day window, moved to latest, then `make build` passed. The scans ran on this tree: `make deps-check` (full gate, -vuln), `make security` and `trivy image`.' \
            "Changed: ${CHANGED:-nothing new in this run}" \
            "Still firing after the bump: ${FIRED:-none}. Run: $RUN_URL")
          if [ -z "$PR" ]; then
            PR=$(jq -n --arg t "$PR_TITLE" --arg h "$BRANCH" --arg b "$body" '{title: $t, head: $h, base: "main", body: $b}' | gh api "repos/$REPO/pulls" --input - --jq .number)
            echo "opened #$PR"
          else
            jq -n --arg b "$body" '{body: $b}' | gh api -X PATCH "repos/$REPO/pulls/$PR" --input - >/dev/null
            echo "updated #$PR"
          fi
          gh api "repos/$REPO/issues/$PR/labels" -f 'labels[]=code-review' -f 'labels[]=task:ready' >/dev/null
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN push or PR starts no pull_request run.
      - name: Dispatch CI on ci/deps-bump
        if: ${{ steps.pr.outputs.number != '' }}
        run: gh api "repos/$REPO/actions/workflows/ci.yml/dispatches" -f ref="$BRANCH"

      # v1.0.0 (ruling 742 (1)): ONE issue for the findings the bump did not
      # clear, found by its exact title among the open issues (pull requests
      # excluded): created when none is open, its body replaced when one is,
      # and closed with a comment by the first run with no such finding.
      - name: Open, update or close the scan issue
        if: ${{ !cancelled() && steps.scans.outcome == 'success' }}
        env:
          FIRED: ${{ steps.scans.outputs.fired }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            --jq ".[] | select(.pull_request == null and .title == \"$SCAN_ISSUE_TITLE\") | .number" | head -n1)
          if [ -z "$FIRED" ]; then
            if [ -n "$issue" ]; then
              gh api "repos/$REPO/issues/$issue/comments" -f body="The scheduled scans found nothing the bump did not clear. Run: $RUN_URL" >/dev/null
              gh api -X PATCH "repos/$REPO/issues/$issue" -f state=closed -f state_reason=completed >/dev/null
              echo "closed #$issue"
            fi
            exit 0
          fi
          pr_ref=none
          [ -z "$PR_NUMBER" ] || pr_ref="#$PR_NUMBER"
          # shellcheck disable=SC2016 # backquotes are markdown, not a command
          body=$(printf '%s\n\n%s\n\n%s\n' \
            'The scheduled scans on main (scans.yml, ruling 742 (1)) still fire after `make deps-bump`, so the bump cannot fix them: a vulnerable version with no fixed release, an image package, or a replace or pseudo-version with no reason comment. Each needs a hand fix or a documented reason (devops.md §9). The Scans step log of the run names each finding.' \
            "Still firing: $FIRED. Fix PR: $pr_ref." \
            "Run: $RUN_URL")
          if [ -z "$issue" ]; then
            issue=$(jq -n --arg t "$SCAN_ISSUE_TITLE" --arg b "$body" '{title: $t, body: $b}' | gh api "repos/$REPO/issues" --input - --jq .number)
            echo "opened #$issue"
          else
            jq -n --arg b "$body" '{body: $b}' | gh api -X PATCH "repos/$REPO/issues/$issue" --input - >/dev/null
            echo "updated #$issue"
          fi

      # v1.0.0: a finding the bump did not clear fails the run, after the PR
      # (if any) and the issue are open, so it is seen and fixed by hand. This
      # is not CI:
      # no PR and no main commit status reads it.
      - name: Fail on a finding the bump did not clear
        if: ${{ !cancelled() && steps.scans.outputs.fired != '' }}
        env:
          FIRED: ${{ steps.scans.outputs.fired }}
        run: |
          echo "::error title=scheduled scans::still firing after the bump: $FIRED (see the Scans step log)"
          exit 1

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env" "$RUNNER_TEMP/bump.b64" "$RUNNER_TEMP/bump.patch" it-image.tar
