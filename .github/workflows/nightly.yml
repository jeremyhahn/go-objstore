# nightly-template: v1.0 (customized) — the long-horizon jobs, off the push path.
#
# Adopted from the company nightly template (software/templates/github-actions/
# nightly.yml in the automatethethings repo), owner ruling 2026-08-20: a job
# that is known-red with a tracked issue, or that verifies a slow-moving
# property, does NOT run per push. It holds a runner to produce information we
# already have.
#
# Unlike the repos this template was written for, NEITHER JOB HERE IS RED.
# Both were green on `main` at 67aa52a (CI run 3865) when they moved. The move
# is a cost decision, and worth stating plainly so nobody reads a nightly job
# as a broken one:
#
#   * fips  — a second complete run of the unit suite and the coverage gate,
#     this time under GOFIPS140=latest / GODEBUG=fips140=only. It roughly
#     doubles the unit-test cost of every push to re-verify a property that
#     changes only when cryptographic call sites change.
#   * trivy — installs a scanner and scans the tree for dependency CVEs and
#     leaked secrets. govulncheck in ci.yml's `security` job already gates
#     every push on Go dependency vulnerabilities, so what moving this defers
#     to nightly is the non-Go lockfiles under api/sdks/ and secret detection.
#
# Neither job gates anything: both were removed from ci.yml's `ci-gate` by the
# same change that created this file. MOVING ONE BACK IS THE WHOLE ACT — put
# the job in ci.yml, add it to ci-gate's `needs`, and add a `check` call to the
# gate loop. A job that can pass and is not required is a fail-open gate.
#
# What is forbidden meanwhile is making either one green dishonestly: setting
# fips back to fips140=on, adding continue-on-error, tag-gating a failing
# package out, trimming the package list, or widening trivy's skip-dirs.

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  # Kept in lockstep with ci.yml. Latest 1.26 patch (owner ruling 2026-08-20);
  # 1.27.0 is BLOCKED for the portfolio (go-objstore#19). setup-go 'stable' is
  # prohibited as a spec.
  GO_VERSION: '1.26.7'
  COVERAGE_THRESHOLD: 89

jobs:
  fips:
    name: FIPS
    runs-on: ubuntu-latest
    # needs: none — nightly runs standalone, and build health is ci.yml's job.
    # In ci.yml this staged behind the fast tier so a broken tree did not burn
    # the slot; there is nothing here to stage behind.
    #
    # Unattended and gating nothing, a generous ceiling costs nothing.
    timeout-minutes: 90
    # GOFIPS140 selects the Go Cryptographic Module at BUILD time; GODEBUG
    # selects the enforcement level at RUN time, and both are needed.
    #
    # "only" rather than "on" (ratified 2026-08-17): "on" loads the module but
    # still PERMITS non-approved algorithms, so a regulated path using MD5,
    # SHA-1 or GCM with a caller-chosen IV passes silently and the job reports
    # green on exactly the thing it exists to catch. "only" makes those
    # operations error or panic.
    #
    # If this job goes red, the failure IS the finding: something on a tested
    # path is using non-approved cryptography. Fix the call site, or — when an
    # external format mandates the primitive — isolate it and record a cited
    # exemption.
    env:
      GOFIPS140: latest
      GODEBUG: fips140=only

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Verify version consistency
      run: make version-check

    # GODEBUG is a runtime setting and cannot fail a compile, but building
    # against the module first keeps a genuine build break from being reported
    # as a test failure.
    - name: Build production packages (FIPS mode)
      run: go build -tags="local awss3 minio gcpstorage azureblob glacier azurearchive" ./...

    # Keep this invocation identical to ci.yml's Test job so FIPS mode uses the
    # same build tags, package scope, and dark-suite/integration exclusions. A
    # FIPS job over a subset of the suite cannot tell you the product is
    # FIPS-clean.
    - name: Run unit tests with coverage
      run: |
        mkdir -p coverage
        make test

    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage/unit.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Coverage: ${COVERAGE}%"
        if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
          echo "Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
          exit 1
        fi

  # trivy fs -- dependency CVEs AND leaked secrets in the tree, on both servers
  # (devops.md §8). test/ holds harnesses that ship in no release; coverage/
  # and bin/ are build output; **/vendor is gitignored language-SDK tooling
  # absent from a CI checkout. api/sdks/* IS scanned -- those SDKs ship, so
  # their lockfiles are in scope. There is no .trivyignore here, so no
  # --ignorefile.
  #
  # examples/ is NO LONGER skipped (go-objstore#17). It was, and that is
  # precisely how examples/encryption -- a tracked Go module -- carried three
  # HIGH advisories while every gate reported green. "Not shipped" is a reason
  # to care less about a finding, not a reason to be unable to see it. Verified
  # clean at the time of the change: `trivy fs --scanners vuln --severity
  # CRITICAL,HIGH ./examples` reports 0.
  #
  # Do not re-add the skip to silence a finding. The per-push gate on the same
  # module is govulncheck in ci.yml's `security` job, which iterates every
  # go.mod in the tree.
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    # needs: none — nightly runs standalone; build health is ci.yml's job.

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # Two paths for one scan. trivy-action's setup step cannot authenticate to
    # github.com from a Gitea runner and upload-sarif has no GHES-compatible
    # endpoint there, so the action path is guarded on the server URL and Gitea
    # runs the trivy CLI below. Both run the same fs scan at the same severity;
    # only the SARIF upload is GitHub-only.
    - name: Trivy scan (SARIF for code scanning)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        format: sarif
        output: trivy-results.sarif
        exit-code: 0
        skip-dirs: test,coverage,bin,**/vendor

    - name: Upload Trivy SARIF
      if: always() && github.server_url == 'https://github.com'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif
        category: trivy-fs

    - name: Trivy scan (fail on CRITICAL/HIGH)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        severity: CRITICAL,HIGH
        exit-code: 1
        format: table
        skip-dirs: test,coverage,bin,**/vendor

    # Retried with backoff: raw.githubusercontent.com intermittently answers a
    # Gitea runner with transient HTTP errors (curl exit 22), which failed the
    # whole job on a fetch that succeeds seconds later. One network blip must
    # not read as a security finding.
    - name: Install Trivy CLI (Gitea)
      if: github.server_url != 'https://github.com'
      run: |
        for i in 1 2 3 4 5; do
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin && exit 0
          echo "trivy install attempt $i failed; retrying in $((i*10))s"
          sleep $((i*10))
        done
        echo "trivy install failed after 5 attempts" >&2
        exit 1

    - name: Trivy scan (Gitea)
      if: github.server_url != 'https://github.com'
      run: |
        trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table \
          --skip-dirs test --skip-dirs coverage --skip-dirs bin \
          --skip-dirs '**/vendor' .
