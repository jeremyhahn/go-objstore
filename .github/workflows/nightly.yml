# Nightly — the scheduled scan. NOT a home for demoted gates.
#
# What this file is for: catching drift that happens with NO push. A
# vulnerability database updates daily, so a tree that was clean this morning
# can be vulnerable tonight without a single commit. Nothing on the push path
# can see that, because nothing on the push path runs.
#
# What this file is NOT for: parking a gate to buy queue position. A first pass
# at ci-template v1.9 moved `fips` and `trivy` here for exactly that reason and
# it was reverted the same night (the Company Agent's ruling 2026-08-21, decided
# identically for go-signal an hour earlier). The template's nightly carve-out
# is for jobs that are KNOWN-RED and cannot clear from inside the repo — a job
# burning 90 runner-minutes to re-report a finding already written on an issue.
# A job that PASSES carries signal, and devops.md §8 makes trivy blocking
# outright.
#
# So both jobs are gates in ci.yml, in the expensive tier and in `ci-gate`.
#
#   * trivy ALSO runs here, and this is the one job where a scheduled copy
#     earns its slot: the code has not changed, but the advisory data has.
#   * fips runs here too, on schedule and workflow_dispatch (Software on #122,
#     the template's placement). It stays a gate: ci.yml runs it on every push
#     to main, on workflow_dispatch and on a PR labelled ci:full, and CI Gate
#     fails when it should have run and did not pass. It is off the plain PR
#     tier, which keeps the fast guard (make build compiles every package with
#     GOFIPS140=latest), so this is the run that covers the tree on the
#     nights between merges; ci.yml's own schedule run skips it.
#
# Adding a job here is a claim that it can go red WITHOUT a push. If it cannot,
# it belongs in ci.yml or nowhere.

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  # Kept in lockstep with ci.yml. The latest stable Go toolchain is the
  # portfolio standard. setup-go 'stable' is prohibited as a
  # spec.
  GO_VERSION: '1.27.3'

jobs:
  # Identical in scope to ci.yml's `fips` job — keep the two in step: the root
  # module's unit suite and the backup suite in FIPS 140-3 only mode
  # (GOFIPS140=latest GODEBUG=fips140=only, set by make test-fips), the
  # coverage threshold included, in the toolchain image built at this commit
  # (ci-standard.md §2). A red night means a non-approved algorithm is on a
  # tested path; fix the call site, never the mode.
  fips:
    name: FIPS 140-3 Tests
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    # needs: none — nightly runs standalone; build health is ci.yml's job.
    timeout-minutes: 60
    env:
      # Kept in lockstep with ci.yml's workflow env.
      COVERAGE_THRESHOLD: 89
      GO_BUILD_TAGS: "local awss3 gcpstorage azureblob glacier azurearchive"
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ github.event_name == 'schedule' && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf 'export %s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      - name: Build the toolchain image
        run: |
          make docker-build-toolchain MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      - name: make test-fips (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make test-fips GO_BUILD_TAGS='$GO_BUILD_TAGS' COVERAGE_THRESHOLD=$COVERAGE_THRESHOLD"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # Identical in scope to ci.yml's `trivy` job — keep the two in step. The only
  # difference is what makes it fail: there, a finding a push introduced; here,
  # a finding the advisory feed introduced.
  #
  # A red night is real and actionable. Do not silence it by widening
  # skip-dirs; fix or record the finding, and remember the same scan gates
  # every merge, so a nightly failure means the push path is about to block
  # too.
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    # needs: none — nightly runs standalone; build health is ci.yml's job.

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # Two paths for one scan. trivy-action's setup step cannot authenticate to
    # github.com from a Gitea runner and upload-sarif has no GHES-compatible
    # endpoint there, so the action path is guarded on the server URL and Gitea
    # runs the trivy CLI below.
    - name: Trivy scan (SARIF for code scanning)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        format: sarif
        output: trivy-results.sarif
        exit-code: 0
        skip-dirs: test,coverage,bin,**/vendor

    - name: Upload Trivy SARIF
      if: always() && github.server_url == 'https://github.com'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif
        category: trivy-fs

    - name: Trivy scan (fail on CRITICAL/HIGH)
      if: github.server_url == 'https://github.com'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        severity: CRITICAL,HIGH
        exit-code: 1
        format: table
        skip-dirs: test,coverage,bin,**/vendor

    # Retried with backoff: raw.githubusercontent.com intermittently answers a
    # Gitea runner with transient HTTP errors (curl exit 22), which failed the
    # whole job on a fetch that succeeds seconds later. One network blip must
    # not read as a security finding.
    - name: Install Trivy CLI (Gitea)
      if: github.server_url != 'https://github.com'
      run: |
        for i in 1 2 3 4 5; do
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin && exit 0
          echo "trivy install attempt $i failed; retrying in $((i*10))s"
          sleep $((i*10))
        done
        echo "trivy install failed after 5 attempts" >&2
        exit 1

    # examples/ is deliberately NOT skipped (go-objstore#17) — a tracked Go
    # module under a skipped directory is a place CVEs live unseen.
    - name: Trivy scan (Gitea)
      if: github.server_url != 'https://github.com'
      run: |
        trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table \
          --skip-dirs test --skip-dirs coverage --skip-dirs bin \
          --skip-dirs '**/vendor' .
