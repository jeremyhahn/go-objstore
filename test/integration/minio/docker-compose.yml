services:
  minio:
    # Built from source: the published MinIO images refuse anonymous pulls.
    build:
      context: ../minio-server
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    # Ephemeral host ports. Nothing outside the compose network uses these --
    # the test service reaches MinIO at minio:9000 by service name and the
    # healthcheck runs inside the container -- so publishing them on fixed host
    # ports bought nothing and cost a collision: this file and
    # test/integration/s3/docker-compose.yml both claimed 9000 and 9001, on a
    # runner that runs jobs concurrently. Docker picks a free port instead;
    # `docker compose port minio 9000` reports it when a human wants to look.
    ports:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build:
      context: ../../..
      dockerfile: test/integration/minio/Dockerfile
      secrets:
        - gomodauth
    depends_on:
      - minio
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    working_dir: /app

networks:
  default:
    name: objstore-minio-test

# The go mod download inside each build resolves the internal first-party
# module go-enclave from Gitea via an optional BuildKit secret carrying the
# read-only module token (conventions/dependency-resolution.md §6). The file is
# supplied by the caller through GOMODAUTH_ENV — the CI integration-test job
# stages it under RUNNER_TEMP, outside the build context. When GOMODAUTH_ENV is
# unset it defaults to /dev/null (empty secret) and the build resolves from the
# public proxy.
secrets:
  gomodauth:
    file: ${GOMODAUTH_ENV:-/dev/null}
