version: '3.8'

services:
  # Test runner that executes CLI integration tests
  test:
    build:
      context: ../../..
      dockerfile: test/integration/cli/Dockerfile
      secrets:
        - gomodauth
    volumes:
      - test-storage:/test-storage
    environment:
      - OBJECTSTORE_BACKEND=local
      - OBJECTSTORE_BACKEND_PATH=/test-storage
      - GO_TEST_TIMEOUT=10m
    # Note: Tests run in the container where the binary is pre-built at /usr/local/bin/objstore

volumes:
  test-storage:

# The go mod download inside each build resolves the internal first-party
# module go-enclave from Gitea via an optional BuildKit secret carrying the
# read-only module token (conventions/dependency-resolution.md §6). The file is
# supplied by the caller through GOMODAUTH_ENV — the CI integration-test job
# stages it under RUNNER_TEMP, outside the build context. When GOMODAUTH_ENV is
# unset it defaults to /dev/null (empty secret) and the build resolves from the
# public proxy.
secrets:
  gomodauth:
    file: ${GOMODAUTH_ENV:-/dev/null}
