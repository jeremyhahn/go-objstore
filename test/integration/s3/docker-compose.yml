services:
  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    # Ephemeral host ports. Nothing outside the compose network uses these --
    # the test service reaches MinIO at minio:9000 by service name and the
    # healthcheck runs inside the container -- so publishing them on fixed host
    # ports bought nothing and cost a collision: this file and
    # test/integration/minio/docker-compose.yml both claimed 9000 and 9001, on a
    # runner that runs jobs concurrently. Docker picks a free port instead;
    # `docker compose port minio 9000` reports it when a human wants to look.
    ports:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build:
      context: ../../..
      dockerfile: test/integration/s3/Dockerfile
    depends_on:
      - minio
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - S3_ENDPOINT=http://minio:9000
    working_dir: /app

networks:
  default:
    name: objstore-s3-test
