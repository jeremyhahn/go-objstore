services:
  floci:
    # PID 1 must reap children and stop on SIGTERM, or `down` hits a zombie.
    init: true
    image: floci/floci@sha256:e97cd0c1dc2aa14e7697fb5ef5018404c4d6345169dbd276315f0bed2c7b0520 # 2.2.0
    environment:
      # Hostname Floci puts in the URLs it returns; the test service reaches
      # Floci at floci:4566 by service name.
      - FLOCI_HOSTNAME=floci
      # S3 only: these services spawn containers through the Docker daemon,
      # which this stack does not give Floci (socket errors otherwise).
      - FLOCI_SERVICES_LAMBDA_ENABLED=false
      - FLOCI_SERVICES_ECS_ENABLED=false
      - FLOCI_SERVICES_EC2_ENABLED=false
      - FLOCI_SERVICES_EKS_ENABLED=false
      - FLOCI_SERVICES_RDS_ENABLED=false
      - FLOCI_SERVICES_ELASTICACHE_ENABLED=false
      - FLOCI_SERVICES_MSK_ENABLED=false
      - FLOCI_SERVICES_OPENSEARCH_ENABLED=false
      - FLOCI_SERVICES_CODEBUILD_ENABLED=false
    # Ephemeral host port. Nothing outside the compose network uses it -- the
    # test service reaches Floci by service name and the healthcheck runs inside
    # the container -- so publishing it on a fixed host port would only invite a
    # collision on a runner that runs jobs concurrently. Docker picks a free
    # port instead; `docker compose port floci 4566` reports it when a human
    # wants to look.
    ports:
      - "4566"
    # Floci's documented health endpoint, the same probe its image ships.
    healthcheck:
      # The image ships no wget; its own probe is a bash /dev/tcp GET of
      # /_floci/health. start_period covers the ~20s native start.
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  test:
    build:
      context: ../../..
      dockerfile: test/integration/s3/Dockerfile
      secrets:
        - gomodauth
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - AWS_REGION=us-east-1
      # Test-only credentials; Floci accepts any non-empty pair.
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_ENDPOINT=http://floci:4566
    working_dir: /app

# The go mod download inside each build resolves the internal first-party
# module go-enclave from Gitea via an optional BuildKit secret carrying the
# read-only module token (conventions/dependency-resolution.md §6). The file is
# supplied by the caller through GOMODAUTH_ENV — the CI integration-test job
# stages it under RUNNER_TEMP, outside the build context. When GOMODAUTH_ENV is
# unset it defaults to /dev/null (empty secret) and the build resolves from the
# public proxy.
secrets:
  gomodauth:
    file: ${GOMODAUTH_ENV:-/dev/null}
