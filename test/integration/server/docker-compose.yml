services:
  # gRPC server instance
  grpc-server:
    init: true
    build:
      context: ../../..
      dockerfile: test/integration/server/Dockerfile.grpc
      secrets:
        - gomodauth
    # No host port publishing: the test runner connects in-network via the
    # service name (grpc-server:50051), and publishing collides with other
    # services on dev machines.
    expose:
      - "50051"
    volumes:
      - grpc-storage:/tmp/objstore
      - grpc-archive:/tmp/archive
    environment:
      - STORAGE_BACKEND=local
      - STORAGE_PATH=/tmp/objstore
      - ARCHIVE_PATH=/tmp/archive
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # REST server instance
  rest-server:
    init: true
    build:
      context: ../../..
      dockerfile: test/integration/server/Dockerfile.rest
      secrets:
        - gomodauth
    expose:
      - "8080"
    volumes:
      - rest-storage:/tmp/objstore
      - rest-archive:/tmp/archive
    environment:
      - STORAGE_BACKEND=local
      - STORAGE_PATH=/tmp/objstore
      - SERVER_PORT=8080
      - ARCHIVE_PATH=/tmp/archive
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # QUIC server instance
  quic-server:
    init: true
    build:
      context: ../../..
      dockerfile: test/integration/server/Dockerfile.quic
      secrets:
        - gomodauth
    expose:
      - "4433/udp"
    volumes:
      - quic-storage:/tmp/objstore
      - quic-archive:/tmp/archive
      - ./certs:/certs:ro
    environment:
      - STORAGE_BACKEND=local
      - STORAGE_PATH=/tmp/objstore
      - SERVER_PORT=4433
      - CERT_FILE=/certs/server.crt
      - KEY_FILE=/certs/server.key
      - ARCHIVE_PATH=/tmp/archive
    networks:
      - test-network

  # MCP server instance (stdio mode testing via HTTP)
  mcp-server:
    init: true
    build:
      context: ../../..
      dockerfile: test/integration/server/Dockerfile.mcp
      secrets:
        - gomodauth
    expose:
      - "8081"
    volumes:
      - mcp-storage:/tmp/objstore
      - mcp-archive:/tmp/archive
    environment:
      - STORAGE_BACKEND=local
      - STORAGE_PATH=/tmp/objstore
      - MCP_MODE=http
      - MCP_PORT=8081
      - ARCHIVE_PATH=/tmp/archive
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Test runner that waits for servers and runs tests
  test:
    build:
      context: ../../..
      dockerfile: test/integration/server/Dockerfile.test
      secrets:
        - gomodauth
    depends_on:
      grpc-server:
        condition: service_healthy
      rest-server:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
      quic-server:
        condition: service_started
    volumes:
      - ../../..:/app
      - ./certs:/certs:ro
    working_dir: /app
    environment:
      - GRPC_SERVER_ADDR=grpc-server:50051
      - REST_SERVER_ADDR=http://rest-server:8080
      - QUIC_SERVER_ADDR=https://quic-server:4433
      - MCP_SERVER_ADDR=http://mcp-server:8081
      - CERT_FILE=/certs/server.crt
      # Trust the self-signed test certificate in Go's system root pool so the
      # CLI's HTTP/3 client can verify the QUIC server.
      - SSL_CERT_FILE=/certs/server.crt
      - GO_TEST_TIMEOUT=15m
    # rest_ipv6_test.go binds the REST listener on [::1] from OBJSTORE_* config;
    # IPv6 is required in this container and the test fails without it.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.lo.disable_ipv6=0
    networks:
      - test-network
    # Build the CLI from the bind-mounted source (so it is never stale), then
    # run the server integration tests.
    command: >
      sh -c '
        go build -buildvcs=false -tags "local awss3 gcpstorage azureblob glacier azurearchive" -o /usr/local/bin/objstore ./cmd/objstore &&
        go test -v -tags "integration local awss3 gcpstorage azureblob glacier azurearchive" ./test/integration/server/... -timeout 15m
      '

volumes:
  grpc-storage:
  grpc-archive:
  rest-storage:
  rest-archive:
  quic-storage:
  quic-archive:
  mcp-storage:
  mcp-archive:

networks:
  test-network: {}

# The go mod download inside each build resolves the internal first-party
# module go-enclave from Gitea via an optional BuildKit secret carrying the
# read-only module token (conventions/dependency-resolution.md §6). The file is
# supplied by the caller through GOMODAUTH_ENV — the CI integration-test job
# stages it under RUNNER_TEMP, outside the build context. When GOMODAUTH_ENV is
# unset it defaults to /dev/null (empty secret) and the build resolves from the
# public proxy.
secrets:
  gomodauth:
    file: ${GOMODAUTH_ENV:-/dev/null}
