services:
  fake-gcs:
    # PID 1 must reap children and stop on SIGTERM, or `down` hits a zombie.
    init: true
    image: fsouza/fake-gcs-server:1.49.1
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory", "-public-host", "fake-gcs:4443"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build:
      context: ../../..
      dockerfile: test/integration/gcs/Dockerfile
      secrets:
        - gomodauth
    depends_on:
      - fake-gcs
    environment:
      - STORAGE_EMULATOR_HOST=http://fake-gcs:4443
    working_dir: /app

# The optional gomodauth secret (GOMODAUTH_ENV, default /dev/null) lets the builds resolve the private go-enclave module.
secrets:
  gomodauth:
    file: ${GOMODAUTH_ENV:-/dev/null}
