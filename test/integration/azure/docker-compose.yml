services:
  azurite:
    # PID 1 must reap children and stop on SIGTERM, or `down` hits a zombie.
    init: true
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    command: azurite --blobHost 0.0.0.0 --blobPort 10000 --location /data --silent
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1:bXlrZXk=

  test:
    build:
      context: ../../..
      dockerfile: test/integration/azure/Dockerfile
      secrets:
        - gomodauth
    depends_on:
      - azurite
    environment:
      - AZURE_ENDPOINT=http://azurite:10000
    working_dir: /app

# The optional gomodauth secret (GOMODAUTH_ENV, default /dev/null) lets the builds resolve the private go-enclave module.
secrets:
  gomodauth:
    file: ${GOMODAUTH_ENV:-/dev/null}
