services:
  # Go ObjectStore server with local storage backend
  objstore-server:
    init: true
    build:
      context: ../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
      args:
        BUILD_TAGS: local
    command: ["/app/objstore-server", "--path", "/tmp/objstore", "--grpc-addr", "0.0.0.0:50051", "--rest-host", "0.0.0.0", "--quic=true", "--quic-addr", "0.0.0.0:4433", "--quic-self-signed", "--mcp=true", "--mcp-addr", "0.0.0.0:8081"]
    environment:
      - STORAGE_BACKEND=local
      - OBJSTORE_REPLICATION_ALLOW_CLIENT_LOCAL_BACKENDS=true
      - OBJSTORE_ARCHIVE_ALLOW_CLIENT_LOCAL_DESTINATIONS=true
      - STORAGE_PATH=/data
      - LOG_LEVEL=info
      - REST_ENABLED=true
      - GRPC_ENABLED=true
      - QUIC_ENABLED=true
    volumes:
      - objstore-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - objstore-net

  # Ruby SDK unit tests
  ruby-unit-tests:
      # No source bind mount: the image is built from this SDK's source and
      # already contains it, tests included. Mounting the tree over it is
      # redundant on a normal host and impossible under a containerised CI
      # runner, where the daemon is asked to mount a path that exists only
      # inside the job container ("mkdir /workspace: file exists").
    build:
      context: ../..
      dockerfile: sdks/ruby/Dockerfile
    command: bundle exec rspec spec/unit --format documentation
    networks:
      - objstore-net

  # Ruby SDK integration tests
  ruby-integration-tests:
    build:
      context: ../..
      dockerfile: sdks/ruby/Dockerfile
    depends_on:
      objstore-server:
        condition: service_healthy
    environment:
      - OBJSTORE_HOST=objstore-server
      - OBJSTORE_REST_PORT=8080
      - OBJSTORE_GRPC_PORT=50051
      - OBJSTORE_QUIC_PORT=4433
      - INTEGRATION_TEST=1
    command: bundle exec rspec spec/integration --format documentation --tag integration
    networks:
      - objstore-net

volumes:
  objstore-data:

networks:
  objstore-net:
    driver: bridge

# The go mod download inside the root-Dockerfile (objstore-server) build resolves
# the internal go-enclave module from Gitea via an optional BuildKit secret
# carrying the read-only module token (conventions/dependency-resolution.md §6);
# the caller supplies the file path in GOMODAUTH_ENV. Unset, it defaults to
# /dev/null and resolves from the public proxy.
secrets:
  gomodauth:
    file: ${GOMODAUTH_ENV:-/dev/null}
