# Project name: never the directory name ("go"), which collides with every other
# checkout's api/sdks/go on a shared daemon. The Makefile exports a stable
# per-checkout COMPOSE_PROJECT_NAME (../compose-project.mk); the default covers
# a bare compose run. No host ports are published: the tests reach
# objstore-server over the compose network, so concurrent projects cannot
# collide on a host port.
name: ${COMPOSE_PROJECT_NAME:-objstore-sdk-go}

services:
  # Go ObjectStore server with local storage backend
  objstore-server:
    init: true
    build:
      context: ../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
      args:
        BUILD_TAGS: local
    command: ["/app/objstore-server", "--path", "/tmp/objstore", "--grpc-addr", "0.0.0.0:50051", "--rest-host", "0.0.0.0", "--quic=true", "--quic-addr", "0.0.0.0:4433", "--quic-self-signed", "--mcp=true", "--mcp-addr", "0.0.0.0:8081"]
    environment:
      - STORAGE_BACKEND=local
      - OBJSTORE_REPLICATION_ALLOW_CLIENT_LOCAL_BACKENDS=true
      - OBJSTORE_ARCHIVE_ALLOW_CLIENT_LOCAL_DESTINATIONS=true
      - STORAGE_PATH=/data
      - LOG_LEVEL=info
      - REST_ENABLED=true
      - GRPC_ENABLED=true
      - QUIC_ENABLED=true
    volumes:
      - objstore-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - objstore-net

  # Go SDK unit tests
  go-unit-tests:
      # No source bind mount: the image is built from this SDK's source and
      # already contains it, tests included. Mounting the tree over it is
      # redundant on a normal host and impossible under a containerised CI
      # runner, where the daemon is asked to mount a path that exists only
      # inside the job container ("mkdir /workspace: file exists").
    build:
      context: ../../..
      dockerfile: api/sdks/go/Dockerfile
      secrets:
        - gomodauth
    working_dir: /workspace/api/sdks/go
    command: go test -v -race -timeout=30s ./...
    networks:
      - objstore-net

  # Go SDK integration tests
  go-integration-tests:
    build:
      context: ../../..
      dockerfile: api/sdks/go/Dockerfile
      secrets:
        - gomodauth
    depends_on:
      objstore-server:
        condition: service_healthy
    environment:
      - OBJSTORE_REST_URL=http://objstore-server:8080
      - OBJSTORE_GRPC_HOST=objstore-server:50051
      - OBJSTORE_QUIC_URL=https://objstore-server:4433
    working_dir: /workspace/api/sdks/go
    command: go test -v -timeout=120s -tags=integration .
    networks:
      - objstore-net

volumes:
  objstore-data:

networks:
  objstore-net:
    driver: bridge

# go mod download inside the objstore-server (root Dockerfile) and go-integration
# builds resolves the internal go-enclave module from Gitea via an optional
# BuildKit secret carrying the read-only module token (dependency-resolution.md
# §6); the caller supplies the file path in GOMODAUTH_ENV. go-unit-tests does
# not need it (go.mod does not list go-enclave, and module pruning keeps it out
# of the SDK's build), but declares the secret for consistency. Unset
# GOMODAUTH_ENV defaults to /dev/null and resolves from the public proxy.
secrets:
  gomodauth:
    file: ${GOMODAUTH_ENV:-/dev/null}
