services:
  # Go ObjectStore server with local storage backend
  objstore-server:
    init: true
    build:
      context: ../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
      args:
        BUILD_TAGS: local
    command: ["/app/objstore-server", "--path", "/tmp/objstore", "--grpc-addr", "0.0.0.0:50051", "--rest-host", "0.0.0.0", "--quic=true", "--quic-addr", "0.0.0.0:4433", "--quic-self-signed", "--mcp=true", "--mcp-addr", "0.0.0.0:8081"]
    environment:
      - STORAGE_BACKEND=local
      - OBJSTORE_REPLICATION_ALLOW_CLIENT_LOCAL_BACKENDS=true
      - OBJSTORE_ARCHIVE_ALLOW_CLIENT_LOCAL_DESTINATIONS=true
      - STORAGE_PATH=/data
      - LOG_LEVEL=info
      - REST_ENABLED=true
      - GRPC_ENABLED=true
      - QUIC_ENABLED=true
    volumes:
      - objstore-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - objstore-net

  # TypeScript SDK unit tests
  typescript-unit-tests:
      # No source bind mount: the image already contains the source, and a containerised runner cannot mount it.
    build:
      context: ../..
      dockerfile: sdks/typescript/Dockerfile
    volumes:
      - /app/node_modules
    command: npm run test:unit
    networks:
      - objstore-net

  # TypeScript SDK integration tests
  typescript-integration-tests:
    build:
      context: ../..
      dockerfile: sdks/typescript/Dockerfile
    depends_on:
      objstore-server:
        condition: service_healthy
    environment:
      - OBJSTORE_REST_URL=http://objstore-server:8080
      - OBJSTORE_GRPC_HOST=objstore-server
      - OBJSTORE_GRPC_PORT=50051
      - OBJSTORE_QUIC_HOST=objstore-server
      - OBJSTORE_QUIC_PORT=4433
    volumes:
      - /app/node_modules
      - ../../proto:/app/proto  # Mount proto files for gRPC client
    command: npm run test:integration
    networks:
      - objstore-net

volumes:
  objstore-data:

networks:
  objstore-net:
    driver: bridge

# GOMODAUTH_ENV is the optional BuildKit secret file for private modules; unset, it is /dev/null.
secrets:
  gomodauth:
    file: ${GOMODAUTH_ENV:-/dev/null}
