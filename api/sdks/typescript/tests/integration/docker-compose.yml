version: '3.8'

services:
  objstore-rest:
    init: true
    image: go-objstore:latest
    container_name: objstore-rest-test
    build:
      context: ../../../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
      args:
        BUILD_TAGS: local
    ports:
      - "8080:8080"
    environment:
      - OBJSTORE_BACKEND=local
      - OBJSTORE_REPLICATION_ALLOW_CLIENT_LOCAL_BACKENDS=true
      - OBJSTORE_ARCHIVE_ALLOW_CLIENT_LOCAL_DESTINATIONS=true
      - OBJSTORE_LOCAL_PATH=/data
      - OBJSTORE_REST_ENABLED=true
      - OBJSTORE_REST_PORT=8080
    volumes:
      - objstore-data-rest:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - objstore-test

  objstore-grpc:
    init: true
    image: go-objstore:latest
    container_name: objstore-grpc-test
    build:
      context: ../../../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
      args:
        BUILD_TAGS: local
    ports:
      - "50051:50051"
    environment:
      - OBJSTORE_BACKEND=local
      - OBJSTORE_REPLICATION_ALLOW_CLIENT_LOCAL_BACKENDS=true
      - OBJSTORE_ARCHIVE_ALLOW_CLIENT_LOCAL_DESTINATIONS=true
      - OBJSTORE_LOCAL_PATH=/data
      - OBJSTORE_GRPC_ENABLED=true
      - OBJSTORE_GRPC_PORT=50051
    volumes:
      - objstore-data-grpc:/data
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - objstore-test

  objstore-quic:
    init: true
    image: go-objstore:latest
    container_name: objstore-quic-test
    build:
      context: ../../../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
      args:
        BUILD_TAGS: local
    ports:
      - "8443:8443/udp"
    environment:
      - OBJSTORE_BACKEND=local
      - OBJSTORE_REPLICATION_ALLOW_CLIENT_LOCAL_BACKENDS=true
      - OBJSTORE_ARCHIVE_ALLOW_CLIENT_LOCAL_DESTINATIONS=true
      - OBJSTORE_LOCAL_PATH=/data
      - OBJSTORE_QUIC_ENABLED=true
      - OBJSTORE_QUIC_PORT=8443
    volumes:
      - objstore-data-quic:/data
    networks:
      - objstore-test

volumes:
  objstore-data-rest:
  objstore-data-grpc:
  objstore-data-quic:

networks:
  objstore-test:
    driver: bridge

# The go mod download inside the root-Dockerfile (objstore-server) build resolves
# the internal go-enclave module from Gitea via an optional BuildKit secret
# carrying the read-only module token (conventions/dependency-resolution.md §6);
# the caller supplies the file path in GOMODAUTH_ENV. Unset, it defaults to
# /dev/null and resolves from the public proxy.
secrets:
  gomodauth:
    file: ${GOMODAUTH_ENV:-/dev/null}
