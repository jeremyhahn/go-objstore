[package]
name = "go-objstore"
version = "0.9.0-alpha"
edition = "2021"
authors = ["Go ObjectStore Contributors"]
description = "Rust SDK for go-objstore with REST, gRPC, and QUIC/HTTP3 support"
license = "AGPL-3.0"
repository = "https://github.com/jeremyhahn/go-objstore"
keywords = ["object-storage", "s3", "grpc", "quic", "http3"]
categories = ["api-bindings", "network-programming"]

[dependencies]
# Async runtime
tokio = { version = "1.54", features = ["full"] }
futures = { version = "0.3.34", features = ["alloc"] }
async-trait = "0.1.92"

# gRPC
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"

# HTTP clients
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
hyper = { version = "1.12", features = ["full"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11.12", features = ["rustls", "ring"] }

# HTTP3/QUIC - versions must be compatible with quinn 0.11
rustls = { version = "0.23.46", features = ["ring"] }
rustls-pemfile = "2.2"
rustls-native-certs = "0.8.5"
rustls-pki-types = "1.16"
tokio-util = { version = "0.7.20", features = ["compat"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Error handling
thiserror = "1.0"
anyhow = "1.0.104"

# Utilities
bytes = "1.12"
url = "2.5.8"
mime = "0.3.18"
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
http = "1.5"
base64 = "0.22.1"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
mockito = "1.7"
wiremock = "0.5"
tempfile = "3.27"
testcontainers = "0.15"
tokio-test = "0.4.6"
paste = "1.0.15"
rcgen = "0.13"

[lib]
name = "go_objstore"
path = "src/lib.rs"

[[example]]
name = "rest_client"
path = "examples/rest_client.rs"

[[example]]
name = "grpc_client"
path = "examples/grpc_client.rs"

[[example]]
name = "quic_client"
path = "examples/quic_client.rs"

[[example]]
name = "unified_client"
path = "examples/unified_client.rs"

[[example]]
name = "mcp_unix_client"
path = "examples/mcp_unix_client.rs"
