services:
  # go-objstore server (local backend) for integration tests
  objstore-server:
    init: true
    build:
      context: ../../..
      dockerfile: Dockerfile
      secrets:
        - gomodauth
      args:
        BUILD_TAGS: local
    command: ["/app/objstore-server", "--quic-self-signed"]
    environment:
      - STORAGE_BACKEND=local
      - STORAGE_PATH=/data
      - LOG_LEVEL=info
      - REST_ENABLED=true
      - GRPC_ENABLED=true
      - QUIC_ENABLED=true
    volumes:
      - objstore-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - objstore-net

  # Rust SDK unit tests: library inline tests (src/*.rs) plus the unit_tests
  # target (type/serde). The integration_* targets require a live server and are
  # intentionally excluded here so the unit suite needs no network.
  rust-unit-tests:
      # No source bind mount: the image is built from this SDK's source and
      # already contains it, tests included. Mounting the tree over it is
      # redundant on a normal host and impossible under a containerised CI
      # runner, where the daemon is asked to mount a path that exists only
      # inside the job container ("mkdir /workspace: file exists").
    build:
      context: ../../..
      dockerfile: api/sdks/rust/Dockerfile
    volumes:
      - cargo-cache:/usr/local/cargo/registry
    command: cargo test --lib --test unit_tests
    networks:
      - objstore-net

  # Rust SDK integration tests: run the integration_* suites against the live
  # server (single-threaded to avoid cross-test races).
  rust-integration-tests:
    build:
      context: ../../..
      dockerfile: api/sdks/rust/Dockerfile
    depends_on:
      objstore-server:
        condition: service_healthy
    environment:
      - OBJSTORE_REST_URL=http://objstore-server:8080
      - OBJSTORE_GRPC_URL=http://objstore-server:50051
      - OBJSTORE_QUIC_URL=https://objstore-server:4433
      - REST_HOST=objstore-server:8080
      - GRPC_HOST=objstore-server:50051
      - QUIC_HOST=objstore-server:4433
    command: cargo test --test integration_comprehensive -- --test-threads=1
    volumes:
      - cargo-cache:/usr/local/cargo/registry
    networks:
      - objstore-net

  # Rust SDK coverage
  rust-coverage:
    build:
      context: ../../..
      dockerfile: api/sdks/rust/Dockerfile.coverage
    volumes:
      - cargo-cache:/usr/local/cargo/registry
    command: cargo llvm-cov --lib --test unit_tests --summary-only
    networks:
      - objstore-net

volumes:
  objstore-data:
  cargo-cache:

networks:
  objstore-net:
    driver: bridge

# The go mod download inside the root-Dockerfile (objstore-server) build resolves
# the internal go-enclave module from Gitea via an optional BuildKit secret
# carrying the read-only module token (conventions/dependency-resolution.md §6);
# the caller supplies the file path in GOMODAUTH_ENV. Unset, it defaults to
# /dev/null and resolves from the public proxy.
secrets:
  gomodauth:
    file: ${GOMODAUTH_ENV:-/dev/null}
